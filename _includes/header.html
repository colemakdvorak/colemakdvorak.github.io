{% assign language = page.lang | default: site.lang %}
{% assign t = site.data.locales[language] %}
<header class="site-header" role="banner">
  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ t.home_url | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="{{ t.navigation_label }}">
      {% for item in t.navigation %}
        <a class="page-link{% if page.url == item.url %} is-current{% endif %}"
           href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
      {% if site.cv_url %}
        <a class="page-link" href="{{ site.cv_url | relative_url }}">{{ t.cv }}</a>
      {% endif %}
    </nav>
    <nav class="language-switcher" aria-label="{{ t.language_label }}">
      {% include language-links.html %}
    </nav>
  </div>
</header>

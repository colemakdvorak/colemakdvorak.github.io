{%- assign language = page.lang | default: site.lang -%}
{%- assign t = site.data.locales[language] -%}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if language == 'ko' %}
    <link rel="preload" href="{{ '/assets/fonts/pretendard/PretendardVariable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/korean-font.css' | relative_url }}">
  {% endif %}
  {% if page.places_map %}
    <link rel="stylesheet" href="{{ '/assets/lib/leaflet/leaflet.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/places-map.css' | relative_url }}">
  {% endif %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} · {{ t.label }}" href="{{ t.feed_url | absolute_url }}">
  {% include language-links.html mode='metadata' %}
  <script src="{{ '/assets/language.js' | relative_url }}" defer></script>
  {% if page.places_map %}
    <script src="{{ '/assets/lib/leaflet/leaflet.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/lib/topojson/topojson-client.min.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/journey-player.js' | relative_url }}" defer></script>
  {% endif %}
</head>

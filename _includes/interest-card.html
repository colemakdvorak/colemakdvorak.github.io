{% assign interest_heading = 'h2' %}
{% if include.nested %}{% assign interest_heading = 'h3' %}{% endif %}
<details class="interest-card{% if include.nested %} interest-card--nested{% endif %}" id="{{ include.id | escape }}">
  <summary>
    <{{ interest_heading }} class="interest-card-title">
      <span>{{ include.title | escape }}</span>
      <svg class="interest-card-chevron" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="m5 7.5 5 5 5-5" />
      </svg>
    </{{ interest_heading }}>
  </summary>
  <div class="interest-card-content">
    {{ include.content | markdownify }}
  </div>
</details>
